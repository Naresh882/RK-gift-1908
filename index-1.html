<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}</style>
<title>Rekha's Birthday Gift</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=DM+Sans:wght@400;500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one full-height stage on a marquee-bulb strip, one screen at a time, red curtain overlay for the midnight reveal. */
:root {
  --wine: #25120c;
  --wine-2: #3e1f14;
  --curtain: #8c4a2f;
  --curtain-dark: #5e2f1c;
  --gold: #ffc857;
  --gold-dark: #b8860f;
  --cream: #fff4e0;
  --paper: #fffaf0;
  --ink: #25120c;
  --rose: #ff8fb1;
  --mint: #62d6b0;
  --sky: #5aa9ff;
  --f-display: "Bowlby One", "Arial Black", Impact, sans-serif;
  --f-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-hand: "Caveat", "Segoe Script", "Bradley Hand", cursive;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  display: flex; flex-direction: column;
  background: radial-gradient(120% 80% at 50% 0%, var(--wine-2) 0%, var(--wine) 70%);
  color: var(--cream);
  font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-block: 0 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
.bulbs {
  height: 16px; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  flex: none;
  background:
    radial-gradient(circle at 12px 8px, var(--gold) 0 4px, transparent 5px) 0 0 / 28px 16px repeat-x;
  animation: twinkle 1.6s steps(2, jump-none) infinite;
}
@keyframes twinkle { 50% { filter: brightness(.55); } }
.stage {
  flex: 1; width: 100%; max-width: 440px; margin: 0 auto;
  display: flex; flex-direction: column; justify-content: center; min-height: 0;
}
.screen {
  display: flex; flex-direction: column; align-items: center; gap: 20px;
  text-align: center; padding-block: 24px;
  animation: rise .5s ease both;
}
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

.eyebrow { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
h1, h2 {
  font-family: var(--f-display); font-weight: 400; margin: 0;
  font-size: clamp(28px, 8.4vw, 40px); line-height: 1.08; text-wrap: balance;
}
h1 span, h2 span { color: var(--rose); }
.sub { margin: 0; color: #f3d9c8; max-width: 32ch; text-wrap: pretty; }
.note { margin: 0; font-size: 14px; color: #d9b8a8; min-height: 1.5em; }

.btn {
  font: inherit; font-weight: 700; font-size: 18px; cursor: pointer;
  padding: 14px 28px; border-radius: 999px; border: 0;
  background: var(--gold); color: var(--ink);
  box-shadow: 0 5px 0 var(--gold-dark);
  transition: transform .12s ease, box-shadow .12s ease;
  min-height: 52px;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--gold-dark); }
.btn.alt { background: var(--cream); box-shadow: 0 5px 0 #c9b79a; }
.btn.alt:active { box-shadow: 0 1px 0 #c9b79a; }
.btn.pink { background: var(--rose); box-shadow: 0 5px 0 #b72e4a; color: #fff; }
.btn.pink:active { box-shadow: 0 1px 0 #b72e4a; }
.row { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

.hero { display: block; width: auto; max-width: 100%; height: auto; max-height: 30vh; border-radius: 18px; border: 4px solid var(--paper); box-shadow: 0 10px 28px rgba(0,0,0,.45); }

/* lock screen */
.lock-badge {
  width: 84px; height: 84px; border-radius: 50%;
  background: var(--curtain); display: grid; place-items: center;
  box-shadow: 0 0 0 5px var(--gold), 0 10px 30px rgba(0,0,0,.5);
}
.dots { display: flex; gap: 14px; height: 22px; }
.dots i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--gold); background: transparent; transition: background .15s; }
.dots i.on { background: var(--gold); }
.dots.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-9px); } 40%, 80% { transform: translateX(9px); } }
.pad { display: grid; grid-template-columns: repeat(3, 68px); gap: 12px; }
.pad button {
  font: inherit; font-size: 24px; font-weight: 700; height: 60px; border-radius: 18px; cursor: pointer;
  background: var(--wine-2); color: var(--cream); border: 2px solid #6a2a3c;
}
.pad button:active { background: var(--curtain); }
.pad .fn { font-size: 15px; color: var(--gold); }

/* gift boxes */
.boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.box { background: none; border: 0; padding: 6px; cursor: pointer; color: inherit; font: inherit; }
.box svg { width: 100%; height: auto; display: block; overflow: visible; }
.box .lid { transform-box: fill-box; transform-origin: 20% 100%; transition: transform .5s cubic-bezier(.3, 1.6, .5, 1); }
.box.open .lid { transform: translate(8px, -22px) rotate(18deg); }
.box:not(.open) svg { animation: bob 2.2s ease-in-out infinite; }
.box:nth-child(2) svg { animation-delay: .3s; }
.box:nth-child(3) svg { animation-delay: .6s; }
@keyframes bob { 50% { transform: translateY(-6px); } }
.reveal {
  width: 100%; min-height: 112px; border-radius: 20px; padding: 18px;
  background: var(--paper); color: var(--ink); text-align: center;
  display: flex; flex-direction: column; justify-content: center; gap: 4px;
}
.reveal b { font-family: var(--f-display); font-weight: 400; font-size: 22px; color: var(--curtain); }
.reveal.empty { background: transparent; border: 2px dashed #6a2a3c; color: #d9b8a8; }
.reveal.pop { animation: pop .35s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }

/* memories */
.reel {
  display: flex; gap: 16px; width: calc(100% + 32px); margin-inline: -16px; padding: 14px 16px 22px;
  overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
}
.polaroid {
  flex: none; width: min(70vw, 270px); scroll-snap-align: center;
  background: var(--paper); color: var(--ink); padding: 12px 12px 16px; border-radius: 6px;
  box-shadow: 0 10px 26px rgba(0,0,0,.5); transform: rotate(-2deg);
}
.polaroid:nth-child(even) { transform: rotate(2.5deg); }
.polaroid .pic {
  aspect-ratio: 1; width: 100%; border-radius: 3px; overflow: hidden; display: grid; place-items: center;
  font-family: var(--f-display); font-size: 64px; color: rgba(255,255,255,.85);
}
.polaroid .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.polaroid p { margin: 12px 0 0; font-family: var(--f-hand); font-size: 24px; line-height: 1.15; }

/* letter */
.letter {
  width: 100%; background: var(--paper); color: var(--ink); border-radius: 6px; padding: 24px 22px; text-align: left;
  box-shadow: 0 10px 26px rgba(0,0,0,.5); min-height: 280px; cursor: pointer;
  background-image: repeating-linear-gradient(transparent 0 31px, #e8d9bd 31px 32px);
  background-position: 0 14px;
}
.letter p { margin: 0; font-family: var(--f-hand); font-size: 25px; line-height: 32px; white-space: pre-wrap; }
.caret::after { content: ""; display: inline-block; width: 2px; height: 1em; background: var(--curtain); margin-left: 2px; vertical-align: -3px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* cake */
.cake { width: 240px; display: flex; flex-direction: column; align-items: center; }
.candles { display: flex; gap: 20px; align-items: flex-end; }
.candle { background: none; border: 0; padding: 4px 6px 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
.candle .flame {
  width: 14px; height: 22px; border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
  background: radial-gradient(circle at 50% 70%, #fff6c2 0 25%, var(--gold) 55%, #ff7a2f 100%);
  box-shadow: 0 0 16px 6px rgba(255, 190, 70, .55);
  animation: flicker .5s ease-in-out infinite alternate; transform-origin: 50% 100%;
}
.candle .stick { width: 11px; height: 40px; border-radius: 3px; margin-top: 3px; }
.candle:nth-child(odd) .stick { background: repeating-linear-gradient(135deg, var(--sky) 0 6px, #fff 6px 12px); }
.candle:nth-child(even) .stick { background: repeating-linear-gradient(135deg, var(--rose) 0 6px, #fff 6px 12px); }
.candle.out .flame { animation: none; opacity: 0; transform: scale(.2); transition: all .35s; box-shadow: none; }
.candle.out::before { content: ""; width: 4px; height: 20px; border-radius: 4px; background: rgba(255,255,255,.4); margin-bottom: -22px; animation: smoke 1.2s ease-out forwards; }
@keyframes flicker { to { transform: scale(1.1, .94) rotate(3deg); } }
@keyframes smoke { to { transform: translateY(-26px) scaleX(2.5); opacity: 0; } }
.tier-top { width: 150px; height: 60px; background: #5a2e1b; border-radius: 14px 14px 6px 6px; position: relative; }
.tier-bot { width: 220px; height: 74px; background: #7b4a2d; border-radius: 14px 14px 8px 8px; margin-top: -2px; position: relative; }
.tier-top::before, .tier-bot::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 22px; border-radius: inherit;
  background: radial-gradient(circle at 14px 10px, var(--cream) 0 11px, transparent 12px) 0 0 / 28px 22px repeat-x;
}
.tier-bot::before { background: radial-gradient(circle at 14px 10px, var(--rose) 0 11px, transparent 12px) 0 0 / 28px 22px repeat-x; }
.plate { width: 250px; height: 12px; border-radius: 50%; background: var(--gold); box-shadow: 0 6px 0 var(--gold-dark); }

/* final */
.big-name { font-family: var(--f-display); color: var(--gold); font-size: clamp(34px, 11vw, 54px); line-height: 1; text-wrap: balance; text-shadow: 0 4px 0 var(--curtain); }
.from { font-family: var(--f-hand); font-size: 28px; color: var(--cream); }

/* curtain */
#curtain { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; overflow: hidden; background: var(--wine); }
#curtain.open { background: transparent; pointer-events: none; }
.panel {
  position: absolute; top: 0; bottom: 0; width: 50.5%;
  background: repeating-linear-gradient(90deg, var(--curtain) 0 22px, var(--curtain-dark) 22px 44px);
  transition: transform 1.3s cubic-bezier(.7, 0, .3, 1);
  box-shadow: inset 0 -40px 60px rgba(0,0,0,.35);
}
.panel.l { left: 0; } .panel.r { right: 0; }
#curtain.open .l { transform: translateX(-102%); }
#curtain.open .r { transform: translateX(102%); }
#curtain.open .readout { opacity: 0; }
.readout { position: relative; text-align: center; transition: opacity .3s; padding-inline: 16px; }
.clock {
  display: inline-block; font-family: var(--f-display); font-size: clamp(34px, 11vw, 52px);
  font-variant-numeric: tabular-nums; color: var(--gold);
  background: var(--wine); border: 4px solid var(--gold); border-radius: 18px; padding: 14px 22px;
  box-shadow: 0 10px 40px rgba(0,0,0,.6);
}
.readout .msg { font-family: var(--f-display); font-size: clamp(26px, 8vw, 36px); color: var(--cream); margin-top: 16px; text-shadow: 0 3px 0 var(--curtain-dark); text-wrap: balance; }
.clock.go { animation: pop .4s cubic-bezier(.3, 1.6, .5, 1); }

#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>


<div class="bulbs" aria-hidden="true"></div>
<main class="stage" id="stage"></main>

<div id="curtain" hidden aria-live="polite">
  <div class="panel l"></div><div class="panel r"></div>
  <div class="readout">
    <div class="clock" id="clock">00:00:00</div>
    <div class="msg" id="clock-msg">Your surprise opens at midnight</div>
  </div>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
/* ============================================================
   EDIT THIS PART: everything personal lives in CONFIG.
   Photos: put a file next to this page (for example "me-and-him.jpg")
   and write that file name in photo. Leave "" to show a colored card.
   ============================================================ */
const CONFIG = {
  name: "Rekha",                       // her name
  nick: "Lucky",                       // the pet name used in the big headlines
  from: "Your friend-sister, always",  // how the note is signed
  unlockAt: "2026-10-19T00:00:00+05:30",  // page stays closed until this moment (12:00 AM, 19 Oct, India time)
  passcode: "1908",                    // the 4 digits she types to open it
  hint: "Hint: your birthday date, then mine",
  gifts: [
    { title: "Chocolates, all yours",  text: "A box of your favourite chocolates, and I promise not to steal any. Maybe one." },
    { title: "Motu Patlu marathon",    text: "Your pick of episodes, a plate of samosas and zero interruptions. Motu would approve." },
    { title: "Sister day out",         text: "Food, shopping and gossip, all on me. You choose the place, I carry the bags." }
  ],
  memories: [
    { photo: "", caption: "The day we became more than friends" },
    { photo: "", caption: "Our fights that always ended with food" },
    { photo: "", caption: "Every secret you kept, and the ones you didn't" },
    { photo: "", caption: "Your worst photo. Saved forever." }
  ],
  letter:
`Happy birthday, {name}!

You started as my friend and somewhere along the way became my sister. Thank you for every laugh, every scolding when I needed one and every time you stood by me without being asked.

You are the only person who can fight with me in the morning and share chocolates with me by evening.

I hope this year gives you everything you wish for, and a lifetime supply of chocolates. Eat them slowly. Or don't. I won't tell.

Now make a wish, {nick}.`,
  wishNote: "Close your eyes, make a wish, then tap each candle to blow it out."
};
/* ============================ END OF EDITABLE PART ============================ */

const $ = (s, r = document) => r.querySelector(s);
const stage = $("#stage");
const COLORS = ["#f2b83b", "#ff5d7a", "#62d6b0", "#5aa9ff", "#fff4e0", "#ff8a3d"];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const pic = (k, alt) => (typeof PICS !== "undefined" && PICS[k]) ? `<img class="hero" src="${PICS[k]}" alt="${alt}">` : "";
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let timers = [];
const later = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };

function build() {
  const name = esc(CONFIG.name), nick = esc(CONFIG.nick), from = esc(CONFIG.from);
  const letterText = CONFIG.letter.replace(/\{name\}/g, CONFIG.name).replace(/\{nick\}/g, CONFIG.nick);
  const gifts = CONFIG.gifts.slice(0, 3);
  const boxColors = [["#8c4a2f", "#5e2f1c"], ["#ff8fb1", "#d9688a"], ["#ffc857", "#d9a22b"]];
  stage.innerHTML = `
  <section class="screen" id="s-lock">
    <div class="lock-badge" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff4e0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2" fill="#f2b83b" stroke="#f2b83b"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
    <div class="eyebrow">Only for ${name}</div>
    <h1>Secret <span>Birthday</span> Gift</h1>
    <div class="dots" id="dots" role="img" aria-label="Passcode"></div>
    <div class="pad" id="pad">
      ${[1,2,3,4,5,6,7,8,9].map(n => `<button type="button" data-k="${n}">${n}</button>`).join("")}
      <button type="button" class="fn" data-k="clear">Clear</button>
      <button type="button" data-k="0">0</button>
      <button type="button" class="fn" data-k="back" aria-label="Delete">Del</button>
    </div>
    <p class="note" id="lock-note">${esc(CONFIG.hint)}</p>
  </section>

  <section class="screen" id="s-ask1" hidden>
    ${pic("gift", "Two cartoon friends with a wrapped gift")}
    <div class="eyebrow">Unlocked</div>
    <h1>I made <span>something</span> for you</h1>
    <p class="sub">Do you wanna see it?</p>
    <div class="row">
      <button type="button" class="btn" id="yes1">Yes</button>
      <button type="button" class="btn alt" id="no1">No</button>
    </div>
    <p class="note" id="no-note"></p>
  </section>

  <section class="screen" id="s-ask2" hidden>
    ${pic("cake", "Two cartoon friends holding a birthday banner")}
    <h1>Are you <span>really</span> excited?</h1>
    <div class="row">
      <button type="button" class="btn" data-go="count">Yes!</button>
      <button type="button" class="btn pink" data-go="count">Very yes!</button>
    </div>
  </section>

  <section class="screen" id="s-gifts" hidden>
    <h2>Tap a box to <span>unlock</span> your gifts</h2>
    <div class="boxes">
      ${gifts.map((g, i) => `
      <button type="button" class="box" data-i="${i}" aria-label="Gift ${i + 1}">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <rect x="14" y="46" width="72" height="46" rx="4" fill="${boxColors[i][1]}"/>
          <rect x="44" y="46" width="12" height="46" fill="#f2b83b"/>
          <g class="lid">
            <rect x="8" y="28" width="84" height="20" rx="4" fill="${boxColors[i][0]}"/>
            <rect x="44" y="28" width="12" height="20" fill="#f2b83b"/>
            <ellipse cx="38" cy="22" rx="13" ry="8" fill="#f2b83b"/>
            <ellipse cx="62" cy="22" rx="13" ry="8" fill="#f2b83b"/>
            <circle cx="50" cy="24" r="6" fill="#b9801a"/>
          </g>
        </svg>
      </button>`).join("")}
    </div>
    <div class="reveal empty" id="reveal" aria-live="polite">Your gifts will show up here</div>
    <button type="button" class="btn" id="gifts-next" data-go="memories" hidden>Next</button>
  </section>

  <section class="screen" id="s-memories" hidden>
    <h2>Our <span>memories</span></h2>
    <div class="reel" id="reel" tabindex="0" aria-label="Photo memories, swipe sideways">
      ${CONFIG.memories.map((m, i) => `
      <figure class="polaroid" style="margin:0">
        <div class="pic" style="background:${["#ff5d7a", "#5aa9ff", "#62d6b0", "#b58cff", "#ff8a3d", "#f2b83b"][i % 6]}">
          ${m.photo ? `<img src="${esc(m.photo)}" alt="${esc(m.caption)}">` : `<span aria-hidden="true">${i + 1}</span>`}
        </div>
        <p>${esc(m.caption)}</p>
      </figure>`).join("")}
    </div>
    <p class="note">Swipe to see more</p>
    <button type="button" class="btn" data-go="letter">Next</button>
  </section>

  <section class="screen" id="s-letter" hidden>
    <div class="eyebrow">A note for you</div>
    <div class="letter" id="letter" role="button" tabindex="0" aria-label="Tap to show the whole note"><p id="letter-text" class="caret"></p></div>
    <button type="button" class="btn" id="letter-next" data-go="wish" hidden>Next</button>
    <p class="note" id="letter-tip">Tap the paper to skip the typing</p>
    <template id="letter-src">${esc(letterText)}</template>
  </section>

  <section class="screen" id="s-wish" hidden>
    <h2>Make a <span>wish</span></h2>
    <p class="sub">${esc(CONFIG.wishNote)}</p>
    <div class="cake">
      <div class="candles" id="candles">
        ${[0, 1, 2, 3, 4].map(i => `<button type="button" class="candle" aria-label="Blow out candle ${i + 1}"><span class="flame"></span><span class="stick"></span></button>`).join("")}
      </div>
      <div class="tier-top"></div><div class="tier-bot"></div><div class="plate"></div>
    </div>
    <p class="note" id="wish-note">5 candles left</p>
  </section>

  <section class="screen" id="s-final" hidden>
    ${pic("older", "Two cartoon friends blowing party horns")}
    <div class="eyebrow">Today is your day</div>
    <h1 class="big-name">Happy Birthday, ${nick}!</h1>
    <p class="sub">Hope your wish comes true. Now go eat some chocolate.</p>
    <div class="from">With love, ${from}</div>
    <button type="button" class="btn alt" id="replay">Watch again</button>
  </section>`;
  wire();
}

let screens = [];
function show(id) {
  screens.forEach(s => { s.hidden = s.id !== "s-" + id; });
  window.scrollTo(0, 0);
}

function wire() {
  screens = [...stage.querySelectorAll(".screen")];

  /* lock */
  const len = CONFIG.passcode.length;
  const dots = $("#dots");
  dots.innerHTML = "<i></i>".repeat(len);
  let code = "";
  const paint = () => [...dots.children].forEach((d, i) => d.classList.toggle("on", i < code.length));
  $("#pad").addEventListener("click", e => {
    const k = e.target.closest("button")?.dataset.k;
    if (k == null) return;
    if (k === "clear") code = "";
    else if (k === "back") code = code.slice(0, -1);
    else if (code.length < len) code += k;
    paint();
    if (code.length === len) {
      if (code === CONFIG.passcode) { later(() => { show("ask1"); }, 250); burst(40, .5, .5); }
      else {
        dots.classList.add("shake");
        $("#lock-note").textContent = "Wrong code, try again";
        later(() => { dots.classList.remove("shake"); code = ""; paint(); }, 450);
      }
    }
  });

  /* ask 1: the No button gives up after a few tries */
  let nos = 0;
  const noMsgs = ["", "Are you sure?", "Please say yes", "Really?? After all I did?", "Okay, fine. It says yes now."];
  const no = $("#no1"), yes = $("#yes1");
  yes.addEventListener("click", () => show("ask2"));
  no.addEventListener("click", () => {
    nos++;
    $("#no-note").textContent = noMsgs[Math.min(nos, noMsgs.length - 1)];
    yes.style.fontSize = (18 + nos * 3) + "px";
    no.style.transform = `scale(${Math.max(.6, 1 - nos * .1)})`;
    if (nos >= 4) { no.textContent = "Yes"; no.onclick = () => show("ask2"); no.classList.remove("alt"); }
  });

  /* generic next buttons */
  stage.addEventListener("click", e => {
    const go = e.target.closest("[data-go]")?.dataset.go;
    if (!go) return;
    if (go === "count") startCountdown();
    else if (go === "letter") { show("letter"); typeLetter(); }
    else show(go);
  });

  /* gifts */
  const gifts = CONFIG.gifts.slice(0, 3);
  const opened = new Set();
  stage.querySelectorAll(".box").forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.i;
    b.classList.add("open");
    opened.add(i);
    const r = $("#reveal");
    r.className = "reveal";
    r.innerHTML = `<b>${esc(gifts[i].title)}</b><span>${esc(gifts[i].text)}</span>`;
    void r.offsetWidth; r.classList.add("pop");
    burst(24, .5, .45);
    if (opened.size === gifts.length) $("#gifts-next").hidden = false;
  }));

  /* letter */
  $("#letter").addEventListener("click", () => finishLetter(true));
  $("#letter").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); finishLetter(true); } });

  /* wish */
  let left = 5;
  stage.querySelectorAll(".candle").forEach(c => c.addEventListener("click", () => {
    if (c.classList.contains("out")) return;
    c.classList.add("out");
    left--;
    $("#wish-note").textContent = left ? `${left} candle${left > 1 ? "s" : ""} left` : "Wish made!";
    if (!left) later(() => { show("final"); burst(160, .5, .35); later(() => burst(100, .2, .5), 500); later(() => burst(100, .8, .5), 900); }, 700);
  }));

  $("#replay").addEventListener("click", () => { reset(); });
}

/* typewriter letter */
let typing = 0, typed = 0, full = "";
function typeLetter() {
  full = $("#letter-src").content.textContent;
  typed = 0;
  const p = $("#letter-text");
  p.classList.add("caret");
  clearInterval(typing);
  typing = setInterval(() => {
    typed += 1;
    p.textContent = full.slice(0, typed);
    if (typed >= full.length) finishLetter(false);
  }, 32);
}
function finishLetter() {
  clearInterval(typing);
  const p = $("#letter-text");
  p.textContent = full;
  p.classList.remove("caret");
  $("#letter-next").hidden = false;
  $("#letter-tip").hidden = true;
}

/* midnight gate: the curtain stays shut and counts down until unlockAt */
const pad2 = n => String(n).padStart(2, "0");
function startCountdown() { show("gifts"); burst(80, .5, .5); }
function gate() {
  const target = new Date(CONFIG.unlockAt).getTime();
  const curtain = $("#curtain"), clock = $("#clock"), msg = $("#clock-msg");
  if (location.hash === "#preview" || !(target > Date.now())) { curtain.hidden = true; return; }
  curtain.hidden = false;
  msg.textContent = "Your surprise opens at midnight";
  const tick = setInterval(() => {
    const left = target - Date.now();
    if (left > 0) {
      const t = Math.ceil(left / 1000);
      clock.textContent = pad2(Math.floor(t / 3600)) + ":" + pad2(Math.floor(t % 3600 / 60)) + ":" + pad2(t % 60);
      return;
    }
    clearInterval(tick);
    clock.textContent = "00:00:00";
    clock.classList.add("go");
    msg.textContent = `Happy Birthday, ${CONFIG.nick}!`;
    burst(140, .5, .5);
    later(() => curtain.classList.add("open"), 1400);
    later(() => { curtain.hidden = true; clock.classList.remove("go"); }, 2900);
  }, 250);
  timers.push(tick);
  tick._ = 0;
}

/* confetti */
const cv = $("#confetti"), ctx = cv.getContext("2d");
let parts = [], raf = 0, W = 0, H = 0, dpr = 1;
function fit() { dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; }
addEventListener("resize", fit); fit();
function burst(n, fx, fy) {
  if (reduce) n = Math.round(n / 4);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 9;
    parts.push({ x: fx * W, y: fy * H, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 5, w: 6 + Math.random() * 6, h: 4 + Math.random() * 5,
      c: COLORS[(Math.random() * COLORS.length) | 0], r: Math.random() * 6, vr: (Math.random() - .5) * .4 });
  }
  if (!raf) raf = requestAnimationFrame(loop);
}
function loop() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  parts = parts.filter(p => p.y < H + 30);
  for (const p of parts) {
    p.vy += .28; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
  }
  raf = parts.length ? requestAnimationFrame(loop) : 0;
  if (!raf) ctx.clearRect(0, 0, W, H);
}

function reset() {
  timers.forEach(t => { clearTimeout(t); clearInterval(t); });
  timers = []; clearInterval(typing);
  parts = [];
  $("#curtain").hidden = true;
  build();
  show("lock");
}

build();
show("lock");
gate();
</script>
